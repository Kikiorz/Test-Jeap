[program:con1_anchored_head_5k]
directory=/workspace/ts_JEPA_con1_clean
command=/workspace/jepawam_official_robot30k/.venv/bin/python -u -m openpi.con1.train_head --cache /workspace/artifacts/con1/anchored_40k_features_v1 --output /workspace/artifacts/checkpoints/con1_anchored_head_40k_v2_5k --steps 5000 --batch-size 128 --horizon 10 --latent-dim 2816 --width 512
