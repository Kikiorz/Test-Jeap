[program:con1_new_server_pipeline]
command=/workspace/ts_JEPA_con1_clean/.venv/bin/python -u scripts/con1_new_server_pipeline.py
directory=/workspace/ts_JEPA_con1_clean
autostart=false
autorestart=false
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/workspace/con1_pipeline.log
stderr_logfile=/workspace/con1_pipeline.err.log
stdout_logfile_maxbytes=52428800
stderr_logfile_maxbytes=52428800
environment=PYTHONPATH="/workspace/ts_JEPA_con1_clean/src:/workspace/ts_JEPA_con1_clean/packages/openpi-client/src:/workspace/ts_JEPA_con1_clean/scripts",XLA_PYTHON_CLIENT_PREALLOCATE="false"
