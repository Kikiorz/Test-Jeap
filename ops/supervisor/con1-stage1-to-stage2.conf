[program:con1_stage1_to_stage2]
command=/opt/supervisor-scripts/con1-stage1-to-stage2.sh
numprocs=1
autostart=false
autorestart=unexpected
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/artifacts/logs/con1_stage1_to_stage2.log
stderr_logfile=/workspace/artifacts/logs/con1_stage1_to_stage2.err.log
stdout_logfile_maxbytes=10485760
stdout_logfile_backups=2
stderr_logfile_maxbytes=10485760
stderr_logfile_backups=2
