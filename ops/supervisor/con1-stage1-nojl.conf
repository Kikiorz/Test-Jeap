[program:con1_stage1_nojl]
command=/opt/supervisor-scripts/con1-stage1-nojl.sh
numprocs=1
environment=CUDA_VISIBLE_DEVICES="0,1,2,3",XLA_PYTHON_CLIENT_PREALLOCATE="false"
autostart=false
autorestart=unexpected
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/artifacts/logs/con1_stage1_nojl.log
stderr_logfile=/workspace/artifacts/logs/con1_stage1_nojl.err.log
stdout_logfile_maxbytes=52428800
stdout_logfile_backups=3
stderr_logfile_maxbytes=52428800
stderr_logfile_backups=3
