[program:con1_pipeline_nojl]
command=/opt/supervisor-scripts/con1-pipeline-nojl.sh
numprocs=1
autostart=false
autorestart=unexpected
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/artifacts/logs/con1_pipeline_nojl.log
stderr_logfile=/workspace/artifacts/logs/con1_pipeline_nojl.err.log
stdout_logfile_maxbytes=10485760
stdout_logfile_backups=2
stderr_logfile_maxbytes=10485760
stderr_logfile_backups=2
