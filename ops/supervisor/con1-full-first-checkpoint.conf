[program:con1_full_first_checkpoint]
command=/opt/supervisor-scripts/con1-full-first-checkpoint.sh
numprocs=1
autostart=false
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/artifacts/logs/con1_full_first_checkpoint.log
stderr_logfile=/workspace/artifacts/logs/con1_full_first_checkpoint.err.log
stdout_logfile_maxbytes=10485760
stdout_logfile_backups=2
stderr_logfile_maxbytes=10485760
stderr_logfile_backups=2
