[program:pure_jepawam_robot_downloads]
command=/workspace/ts_JEPA_con/.venv/bin/python -u ops/run_pure_jepawam_robot_sweep.py download
directory=/workspace/ts_JEPA_con
autostart=false
autorestart=false
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=45
environment=PYTHONPATH="/workspace/ts_JEPA_con/src:/workspace/ts_JEPA_con/ops",HF_HOME="/workspace/.hf_home",HF_HUB_OFFLINE="0",HF_HUB_DISABLE_PROGRESS_BARS="1",OMP_NUM_THREADS="2",OPENBLAS_NUM_THREADS="1"
stdout_logfile=/workspace/artifacts/research_reports/con/pure_jepawam_robot_checkpoints_20260909/download.log
stderr_logfile=/workspace/artifacts/research_reports/con/pure_jepawam_robot_checkpoints_20260909/download.err.log
stdout_logfile_maxbytes=52428800
stderr_logfile_maxbytes=52428800

[program:pure_jepawam_robot_sweep]
command=/workspace/ts_JEPA_con/.venv/bin/python -u ops/run_pure_jepawam_robot_sweep.py evaluation
directory=/workspace/ts_JEPA_con
autostart=false
autorestart=false
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=45
environment=PYTHONPATH="/workspace/ts_JEPA_con/src:/workspace/ts_JEPA_con/ops",HF_HOME="/workspace/.hf_home",HF_HUB_OFFLINE="1",OMP_NUM_THREADS="2",OPENBLAS_NUM_THREADS="1",MKL_NUM_THREADS="1",XLA_PYTHON_CLIENT_PREALLOCATE="false"
stdout_logfile=/workspace/artifacts/research_reports/con/pure_jepawam_robot_checkpoints_20260909/evaluation.log
stderr_logfile=/workspace/artifacts/research_reports/con/pure_jepawam_robot_checkpoints_20260909/evaluation.err.log
stdout_logfile_maxbytes=52428800
stderr_logfile_maxbytes=52428800
