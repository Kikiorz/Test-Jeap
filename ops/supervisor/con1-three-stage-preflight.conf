[program:con1_three_stage_preflight]
directory=/workspace/ts_JEPA_con1_clean
command=/workspace/ts_JEPA_con1_clean/.venv/bin/python -u scripts/audit_con1_three_stage.py
autostart=false
autorestart=false
stopasgroup=true
killasgroup=true
stopwaitsecs=60
environment=PYTHONPATH="/workspace/ts_JEPA_con1_clean/src",CUDA_VISIBLE_DEVICES="0,1,2,3",LD_PRELOAD="/usr/lib/x86_64-linux-gnu/libnccl.so.2",HF_HOME="/workspace/.hf_home",HF_HUB_OFFLINE="1",XLA_PYTHON_CLIENT_PREALLOCATE="false",NCCL_P2P_DISABLE="1",NCCL_IB_DISABLE="1"
redirect_stderr=true
stdout_logfile=/workspace/con1_three_stage_preflight.log
stdout_logfile_maxbytes=52428800
