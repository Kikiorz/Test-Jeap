[program:con1_10k_decision]
command=/opt/supervisor-scripts/con1-10k-decision.sh
numprocs=1
autostart=false
autorestart=false
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/artifacts/logs/con1_10k_decision.log
stderr_logfile=/workspace/artifacts/logs/con1_10k_decision.err.log
stdout_logfile_maxbytes=10485760
stdout_logfile_backups=2
stderr_logfile_maxbytes=10485760
stderr_logfile_backups=2
