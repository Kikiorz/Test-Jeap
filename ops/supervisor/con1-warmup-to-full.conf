[program:con1_warmup_to_full]
command=/opt/supervisor-scripts/con1-warmup-to-full.sh
numprocs=1
autostart=false
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/artifacts/logs/con1_warmup_to_full.log
stderr_logfile=/workspace/artifacts/logs/con1_warmup_to_full.err.log
stdout_logfile_maxbytes=10485760
stdout_logfile_backups=2
stderr_logfile_maxbytes=10485760
stderr_logfile_backups=2
