[program:actr-full-experiment]
command=/workspace/openpi_jepawam/scripts/run_actr_full_experiment.sh
directory=/workspace/openpi_jepawam
environment=PYTHONUNBUFFERED="1",TF_FORCE_GPU_ALLOW_GROWTH="true"
autostart=false
autorestart=false
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=7200
stdout_logfile=/workspace/artifacts/logs/actr-full-experiment.log
redirect_stderr=true
stdout_logfile_maxbytes=104857600
stdout_logfile_backups=2
